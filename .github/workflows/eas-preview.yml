# EAS Build: Android preview APK (internal distribution).
#
# REQUIRES:
#   - Repository secret EXPO_TOKEN (Expo personal access token / robot token:
#     https://expo.dev/settings/access-tokens). Without it this workflow fails.
#   - The project must be linked to an EAS project first (run `eas init` locally,
#     which writes extra.eas.projectId to app config, and commit it), and Android
#     credentials must exist (run one `eas build -p android --profile preview`
#     locally, or set up credentials on expo.dev), because CI runs non-interactively.
#
# The build runs on EAS servers; with --no-wait this job finishes once the build
# is queued. Download the APK from the build page on expo.dev.
name: EAS Preview Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: eas-preview-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android-preview:
    name: Android preview (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check EXPO_TOKEN is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        run: eas build --platform android --profile preview --non-interactive --no-wait
